server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (filename changes every build) can be cached
    # aggressively and safely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately instead of serving a stale shell that references old
    # (no-longer-existing) hashed asset filenames.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
