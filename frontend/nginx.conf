server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container over the internal
    # Docker network. The trailing slash on both the location and
    # proxy_pass strips the "/api" prefix, so the backend still sees its
    # normal unprefixed routes (e.g. /api/auth/login -> backend:8000/auth/login).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (filename changes every build) can be cached
    # aggressively and safely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately instead of serving a stale shell that references old
    # (no-longer-existing) hashed asset filenames.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
